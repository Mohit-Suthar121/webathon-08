<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#BE123C" />
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="128" fill="none" stroke="#334155" stroke-width="8" opacity="0.4" />

  <!-- Radar rings -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#F43F5E" stroke-width="3" stroke-dasharray="12 12" opacity="0.25" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="#F43F5E" stroke-width="4" opacity="0.35" />

  <!-- Center Shield -->
  <path d="M 256 100 L 370 150 C 370 270 310 360 256 410 C 202 360 142 270 142 150 Z" 
        fill="url(#shieldGrad)" 
        filter="url(#glow)" />

  <!-- Shield highlight bevel -->
  <path d="M 256 112 L 358 157 C 358 262 305 348 256 394 Z" 
        fill="#FFFFFF" 
        opacity="0.15" />

  <!-- First Aid / Relief Medical Cross -->
  <rect x="234" y="185" width="44" height="130" rx="12" fill="url(#crossGrad)" />
  <rect x="191" y="228" width="130" height="44" rx="12" fill="url(#crossGrad)" />

  <!-- Live Pulse Beacon -->
  <circle cx="370" cy="140" r="18" fill="#F43F5E" />
  <circle cx="370" cy="140" r="28" fill="none" stroke="#FDA4AF" stroke-width="4" opacity="0.75" />
</svg>
